name: Diagnose reported public share
on:
  push:
    paths:
      - scripts/check-real-share.mjs
      - .github/workflows/diagnose-real-share.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-real-share.mjs
