name: Inspect Classroom Makers Domain

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/inspect-classroom-domain.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query EdgeOne project's assigned domain (read-only)
        shell: bash
        env:
          MAKERS_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          test -n "$MAKERS_API_TOKEN" || { echo "Missing EDGEONE_API_TOKEN"; exit 1; }
          mkdir -p "$RUNNER_TEMP/makers-inspect"
          cd "$RUNNER_TEMP/makers-inspect"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent @edgeone/makers-sdk
          cat > inspect.mjs <<'EOF'
          import { Makers } from '@edgeone/makers-sdk';
          const client = new Makers({token:process.env.MAKERS_API_TOKEN,region:'china'});
          const wanted = new Set(['chatgpt-share-text-extractor-global','classroom-enhancer-workbench','classroom-enhancer-global']);
          for await (const entry of client.projects.listAll()) {
            if (!wanted.has(entry.name)) continue;
            const project = await client.projects.get({projectId:entry.projectId});
            console.log('COMPARISON', JSON.stringify({name:project.name,projectId:project.projectId,area:project.area,domain:project.presetDomain,status:project.status}));
            const response=await fetch('https://'+project.presetDomain,{signal:AbortSignal.timeout(20000)});
            const html=await response.text();
            console.log('HEALTH',JSON.stringify({name:project.name,status:response.status,title:html.match(/<title>(.*?)<\/title>/)?.[1],classroom:html.includes('课堂工作台')}));
          }
          EOF
          node inspect.mjs
