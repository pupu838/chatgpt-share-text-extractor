mily="Arial">词族：tentatively (adv.)  · 未收录</text><rect x="25" y="1014" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1034" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="1136" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🌧️</text><text x="225" y="1057" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 05. pervasive <tspan font-size="19" fill="#52718e"> adj. /pəˈveɪsɪv/</tspan></text><text x="225" y="1092" font-size="18.5" fill="#21334b" font-family="Arial">present or spreading through nearly every part</text><text x="225" y="1124" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：普遍存在的；弥漫的</text><text x="225" y="1151" font-size="19" fill="#304c69" font-family="Arial">搭配：pervasive influence</text><text x="225" y="1178" font-size="19" fill="#476684" font-family="Arial">词族：pervade (v.)  · 未收录</text><rect x="25" y="1238" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="1258" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="1360" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">⚖️</text><text x="225" y="1281" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 06. counterintuitive <tspan font-size="19" fill="#52718e"> adj. /ˌkaʊntərɪnˈtjuːɪtɪv/</tspan></text><text x="225" y="1316" font-size="18.5" fill="#21334b" font-family="Arial">opposite to what you would normally expect</text><text x="225" y="1348" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：违反直觉的</text><text x="225" y="1375" font-size="19" fill="#304c69" font-family="Arial">搭配：a counterintuitive finding</text><text x="225" y="1402" font-size="19" fill="#476684" font-family="Arial">词族：intuition (n.)  · 未收录</text><rect x="25" y="1462" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1