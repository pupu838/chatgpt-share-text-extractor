<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2400" viewBox="0 0 1120 2400"><rect width="1120" height="2400" fill="#f4f7fc"/><rect width="1120" height="96" fill="#173a64"/><text x="45" y="57" font-size="38" font-weight="700" fill="#fff" font-family="Noto Sans CJK SC,Arial">CET6 · 10月31日 · 高价值新词候选</text><text x="1060" y="58" text-anchor="end" font-size="22" fill="#d4e7ff" font-family="Arial">2/3</text><rect x="25" y="118" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="138" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="240" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🤫</text><text x="225" y="161" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 11. suppress <tspan font-size="19" fill="#52718e"> v. /səˈpres/</tspan></text><text x="225" y="196" font-size="18.5" fill="#21334b" font-family="Arial">to stop or control something from spreading or being expressed</text><text x="225" y="228" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：压制；抑制</text><text x="225" y="255" font-size="19" fill="#304c69" font-family="Arial">搭配：suppress an immune response</text><text x="225" y="282" font-size="19" fill="#476684" font-family="Arial">词族：suppression (n.)  · 未收录</text><rect x="25" y="342" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="362" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="464" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🧱</text><text x="225" y="385" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 12. consolidate <tspan font-size="19" fill="#52718e"> v. /kənˈsɒlɪdeɪt/</tspan></text><text x="225" y="420" font-size="18.5" fill="#21334b" font-family="Arial">to combine things or make something stronger</text><text x="225" y="452" font-size="23" fill="#263b58" font-fami