4" font-size="19" fill="#476684" font-family="Arial">词族：requisite (adj.)  · 未收录</text><rect x="25" y="1014" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1034" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="1136" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🌦️</text><text x="225" y="1057" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 15. intermittent <tspan font-size="19" fill="#52718e"> adj. /ˌɪntəˈmɪtənt/</tspan></text><text x="225" y="1092" font-size="18.5" fill="#21334b" font-family="Arial">happening at intervals rather than continuously</text><text x="225" y="1124" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：间歇性的；断续的</text><text x="225" y="1151" font-size="19" fill="#304c69" font-family="Arial">搭配：intermittent rainfall</text><text x="225" y="1178" font-size="19" fill="#476684" font-family="Arial">词族：intermittently (adv.)  · 未收录</text><rect x="25" y="1238" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="1258" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="1360" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🚀</text><text x="225" y="1281" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 16. unprecedented <tspan font-size="19" fill="#52718e"> adj. /ʌnˈpresɪdentɪd/</tspan></text><text x="225" y="1316" font-size="18.5" fill="#21334b" font-family="Arial">never known or experienced before</text><text x="225" y="1348" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：史无前例的</text><text x="225" y="1375" font-size="19" fill="#304c69" font-family="Arial">搭配：unprecedented growth</text><text x="225" y="1402" font-size="19" fill="#476684" font-family="Arial">词族：precedent (n.)  · 未收录</text><rect x="25" y="1462" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1482" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="1584" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🔁</text><text x="225" y="1505" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 17. perpetuate <tspan font-size="19" fill="#52718e"> v. /pəˈpetʃueɪt/</tspan></text><text x="225" y="1540" font-size="18.5" fill="#21334b" font-family="Arial">to cause something to continue for a long time</text><text x="225" y="1572" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：使持续；使长期存在</text><text x="225" y="1599" font-size="19" fill="#304c69" font-family="Arial">搭配：perpetuate inequality</text><text x="225" y="1626" font-size="19" fill="#476684" font-family="Arial">词族：perpetuation (n.)  · 未收录</text><rect x="25" y="1686" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="1706" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="1808" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">😕</text><text x="225" y="1729" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 18. ambivalent <tspan font-size="19" fill="#52718e"> adj. /æmˈbɪvələnt/</tspan></text><text x="225" y="1764" font-size="18.5" fill="#21334b" font-family="Arial">having conflicting feelings about someone or something</text><text x="225" y="1796" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：矛盾的；喜忧参半的</text><text x="225" y="1823" font-size="19" fill="#304c69" font-family="Arial">搭配：ambivalent about the proposal</text><text x="225" y="1850" font-size="19" fill="#476684" font-family="Arial">词族：ambivalence (n.)  · 未收录</text><rect x="25" y="1910" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1930" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="2032" font-size="84" text-anchor="middl