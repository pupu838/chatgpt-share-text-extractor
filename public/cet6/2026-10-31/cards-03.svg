<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2400" viewBox="0 0 1120 2400"><rect width="1120" height="2400" fill="#f4f7fc"/><rect width="1120" height="96" fill="#173a64"/><text x="45" y="57" font-size="38" font-weight="700" fill="#fff" font-family="Noto Sans CJK SC,Arial">CET6 · 10月31日 · 高价值新词候选</text><text x="1060" y="58" text-anchor="end" font-size="22" fill="#d4e7ff" font-family="Arial">3/3</text><rect x="25" y="118" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="138" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="240" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🎱</text><text x="225" y="161" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 21. repercussion <tspan font-size="19" fill="#52718e"> n. /ˌriːpəˈkʌʃən/</tspan></text><text x="225" y="196" font-size="18.5" fill="#21334b" font-family="Arial">an indirect effect of an event, often unpleasant</text><text x="225" y="228" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：连锁反应；负面后果</text><text x="225" y="255" font-size="19" fill="#304c69" font-family="Arial">搭配：serious repercussions</text><text x="225" y="282" font-size="19" fill="#476684" font-family="Arial">词族：repercussive (adj.)  · 未收录</text><rect x="25" y="342" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="362" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="464" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🌿</text><text x="225" y="385" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 22. resilient <tspan font-size="19" fill="#52718e"> adj. /rɪˈzɪliənt/</tspan></text><text x="225" y="420" font-size="18.5" fill="#21334b" font-family="Arial">able to recover quickly after difficulty</text><text x="225" y="452" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：有韧性的；恢复力强的</text><text x="225" y="479" font-size="19" fill="#304c69" font-family="Arial">搭配：resilient communities</text><text x="225" y="506" font-size="19" fill="#476684" font-family="Arial">词族：resilience (n.)  · 未收录</text><rect x="25" y="566" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="586" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="688" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🗨️</text><text x="225" y="609" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 23. implicit <tspan font-size="19" fill="#52718e"> adj. /ɪmˈplɪsɪt/</tspan></text><text x="225" y="644" font-size="18.5" fill="#21334b" font-family="Arial">suggested without being directly stated</text><text x="225" y="676" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：含蓄的；不明说的</text><text x="225" y="703" font-size="19" fill="#304c69" font-family="Arial">搭配：implicit assumptions</text><text x="225" y="730" font-size="19" fill="#476684" font-family="Arial">词族：implicitly (adv.)  · 词库New</text><rect x="25" y="790" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="810" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="912" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">❌</text><text x="225" y="833" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 24. contradict <tspan font-size="19" fill="#52718e"> v. /ˌkɒntrəˈdɪkt/</tspan></text><text x="225" y="868" font-size="18.5" fill="#21334b" font-family="Arial">to say or show the opposite of a statement</text><text x="225" y="900" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：反驳；与……矛盾</text><text x="225" y="927" font-size="19" fill="#304c69" font-family="Arial">搭配：contradict the evidence</text><text x="225" y="954" font-size="19" fill="#476684" font-family="Arial">词族：contradiction (n.)  · 词库New</text><rect x="25" y="1014" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1034" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="1136" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🙅</text><text x="225" y="1057" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 25. reluctant <tspan font-size="19" fill="#52718e"> adj. /rɪˈlʌktənt/</tspan></text><text x="225" y="1092" font-size="18.5" fill="#21334b" font-family="Arial">unwilling or hesitant to do something</text><text x="225" y="1124" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：不情愿的；勉强的</text><text x="225" y="1151" font-size="19" fill="#304c69" font-family="Arial">搭配：reluctant to admit</text><text x="225" y="1178" font-size="19" fill="#476684" font-family="Arial">词族：reluctance (n.)  · 词库New</text><rect x="25" y="1238" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="1258" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="1360" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🎨</text><text x="225" y="1281" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 26. nuance <tspan font-size="19" fill="#52718e"> n. /ˈnjuːɑːns/</tspan></text><text x="225" y="1316" font-size="18.5" fill="#21334b" font-family="Arial">a small but meaningful difference in meaning or feeling</text><text x="225" y="1348" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：细微差别</text><text x="225" y="1375" font-size="19" fill="#304c69" font-family="Arial">搭配：subtle nuances</text><text x="225" y="1402" font-size="19" fill="#476684" font-family="Arial">词族：nuanced (adj.)  · 词库New</text><rect x="25" y="1462" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1482" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="1584" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">📅</text><text x="225" y="1505" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 27. consecutive <tspan font-size="19" fill="#52718e"> adj. /kənˈsekjʊtɪv/</tspan></text><text x="225" y="1540" font-size="18.5" fill="#21334b" font-family="Arial">following one after another without a break</text><text x="225" y="1572" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：连续的；接连的</text><text x="225" y="1599" font-size="19" fill="#304c69" font-family="Arial">搭配：three consecutive years</text><text x="225" y="1626" font-size="19" fill="#476684" font-family="Arial">词族：consecutively (adv.)  · 词库New</text><rect x="25" y="1686" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="1706" width="155" height="170" rx="15" fill="#faeed8"/><text x="122" y="1808" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🧩</text><text x="225" y="1729" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 28. redundant <tspan font-size="19" fill="#52718e"> adj. /rɪˈdʌndənt/</tspan></text><text x="225" y="1764" font-size="18.5" fill="#21334b" font-family="Arial">unnecessary because there is more than needed</text><text x="225" y="1796" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：多余的；冗余的</text><text x="225" y="1823" font-size="19" fill="#304c69" font-family="Arial">搭配：redundant information</text><text x="225" y="1850" font-size="19" fill="#476684" font-family="Arial">词族：redundancy (n.)  · 词库New</text><rect x="25" y="1910" width="1070" height="210" rx="18" fill="#edf4fd" stroke="#d8e3f0"/><rect x="45" y="1930" width="155" height="170" rx="15" fill="#e4e9fa"/><text x="122" y="2032" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🧯</text><text x="225" y="1953" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 29. contingency <tspan font-size="19" fill="#52718e"> n. /kənˈtɪndʒənsi/</tspan></text><text x="225" y="1988" font-size="18.5" fill="#21334b" font-family="Arial">a possible future event that needs planning for</text><text x="225" y="2020" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：突发情况；可能发生的事</text><text x="225" y="2047" font-size="19" fill="#304c69" font-family="Arial">搭配：a contingency plan</text><text x="225" y="2074" font-size="19" fill="#476684" font-family="Arial">词族：contingent (adj.)  · 词库New</text><rect x="25" y="2134" width="1070" height="210" rx="18" fill="#ffffff" stroke="#d8e3f0"/><rect x="45" y="2154" width="155" height="170" rx="15" fill="#dcecf8"/><text x="122" y="2256" font-size="84" text-anchor="middle" font-family="Apple Color Emoji,Noto Color Emoji,Segoe UI Emoji,Arial">🎲</text><text x="225" y="2177" font-size="27" font-weight="700" fill="#173a64" font-family="Arial"> 30. arbitrary <tspan font-size="19" fill="#52718e"> adj. /ˈɑːbɪtrəri/</tspan></text><text x="225" y="2212" font-size="18.5" fill="#21334b" font-family="Arial">based on personal choice rather than a clear rule</text><text x="225" y="2244" font-size="23" fill="#263b58" font-family="Noto Sans CJK SC,Arial">中文：任意的；武断的</text><text x="225" y="2271" font-size="19" fill="#304c69" font-family="Arial">搭配：an arbitrary decision</text><text x="225" y="2298" font-size="19" fill="#476684" font-family="Arial">词族：arbitrarily (adv.)  · 词库New</text><text x="45" y="2390" font-size="18" fill="#667c92" font-family="Noto Sans CJK SC,Arial">参考 Collins Dictionary · 英文定义为原创简释（并非词典原文）｜候选词≠净新或已掌握</text></svg>